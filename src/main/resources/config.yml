debug: true
main-server: "main"
# 启用后，为大厅 profile 应用饱和、满血等效果，并发放可打开 /mgc 的菜单钟
enable-lobby-profile-features: true
#lobby-spawn: # 大厅出生点
#  world-key: "minecraft:overworld" # 世界键名（Bukkit world 自 26.1 起为 obsolete）
#  x: 0.5
#  y: 100
#  z: 0.5
#  yaw: 0
#  pitch: 0

# 游戏类别：0 或 1 个类别时主菜单直接显示所有游戏；多个类别时先显示类别。
# 类别和每个类别中的游戏最多 27 个；name 和 lore 均支持 MiniMessage。
# icon 使用 Bukkit Material 名称（如 GRASS_BLOCK、DIAMOND_SWORD）；未配置或无效时使用 CHEST。
# 类别 ID 应保持稳定；未分类或类别被删除的游戏暂归第一个类别。
# 管理员使用 /mgcop category 分配类别，结果自动保存到 game-categories.yml。
game-categories: {}
