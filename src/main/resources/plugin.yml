name: MCZJUGameCore
version: '${project.version}'
main: com.github.mczjuops.mczjugamecore.MCZJUGameCore
api-version: '1.21.7'

commands:
  mgc:
    description: "小游戏基础命令"
    permission: mgc.mgc
  party:
    description: "组队指令"
    permission: mgc.party
  menu:
    description: "菜单指令"
    usage: "/menu menu_name args"
    permission: menu.default
  mgcop:
    description: "MCZJUGameCore管理员命令，详见文档"
    permission: mgc.dev


permissions:
  mgc.mgc:
    default: true
  mgc.party:
    default: true
  mgc.dev:
    default: op
  menu.default:
    default: true
  menu.op:
    default: op
