name: MCZJUGameCore
version: '${project.version}'
main: com.github.mczjuops.mczjugamecore.MCZJUGameCore
api-version: '26.2'
softdepend:
  - packetevents
  - Multiverse-Core
  - voicechat
commands:
  mgc:
    description: "小游戏基础命令"
    permission: mgc.mgc
  party:
    description: "组队系统命令"
    permission: mgc.party
  menu:
    description: "打开部分MCZJUGameCore或子插件的菜单"
    permission: menu.op
  mgcop:
    description: "MCZJUGameCore管理员命令"
    permission: mgc.dev
  lobby:
    description: "传送到主大厅、小游戏大厅或游戏类别大厅"
    aliases: [l]
    permission: mgc.lobby


permissions:
  mgc.mgc:
    default: true
  mgc.party:
    default: true
  mgc.lobby:
    default: true
  mgc.mention.all:
    description: "允许在聊天中使用 @ all / @@ all 提醒全服玩家（默认所有人可用，可按玩家收回）"
    default: true
  mgc.dev:
    default: op
  menu.default:
    default: true
  menu.op:
    default: op
